spring:
  application:
    name: ai-lab-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_lab}
    username: ${POSTGRES_USER:ai_lab}
    password: ${POSTGRES_PASSWORD:ai_lab}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${LLM_CHAT_MODEL:llama3.2:3b}
          temperature: ${LLM_TEMPERATURE:0.2}
      embedding:
        options:
          model: ${LLM_EMBEDDING_MODEL:nomic-embed-text}

  servlet:
    multipart:
      max-file-size: ${KNOWLEDGE_MAX_FILE_SIZE_MB:10}MB
      max-request-size: ${KNOWLEDGE_MAX_FILE_SIZE_MB:10}MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

ailab:
  knowledge:
    storage-path: ${KNOWLEDGE_STORAGE_PATH:./knowledge-documents}
    top-k: ${RAG_TOP_K:5}
    minimum-similarity: ${RAG_MINIMUM_SIMILARITY:0.25}
    chunk-target-words: ${RAG_CHUNK_TARGET_WORDS:220}
    chunk-overlap-words: ${RAG_CHUNK_OVERLAP_WORDS:35}
