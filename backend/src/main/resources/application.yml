spring:
  application:
    name: ai-lab-backend
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${LLM_CHAT_MODEL:llama3.2:3b}
          temperature: ${LLM_TEMPERATURE:0.2}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
