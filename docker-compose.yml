services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_lab}
      POSTGRES_USER: ${POSTGRES_USER:-ai_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_lab}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-llama3.2:3b}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/ollama-init.sh"]
    volumes:
      - ./ollama-init.sh:/scripts/ollama-init.sh:ro
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-llama3.2:3b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  ollama-data:
